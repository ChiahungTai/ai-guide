9" y2="427" class="messageLine0" data-et="message" data-id="i8" data-from="G" data-to="U" stroke-width="2" stroke="none" marker-end="url(#svg-pb-seq-arrowhead)" style="fill: none;"/><text x="413" y="431" font-family="sans-serif" font-size="12px" text-anchor="middle" class="sequenceNumber">6</text><style>#svg-pb-seq{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg-pb-seq .actor{stroke:#9370DB;fill:#ECECFF;stroke-width:1;}#svg-pb-seq text.actor>tspan{fill:black;stroke:none;}#svg-pb-seq .actor-line{stroke:#9370DB;}#svg-pb-seq .messageLine0{stroke-width:1.5;stroke-dasharray:none;stroke:#333;}#svg-pb-seq .messageLine1{stroke-width:1.5;stroke-dasharray:2,2;stroke:#333;}#svg-pb-seq [id$="-arrowhead"] path{fill:#333;stroke:#333;}#svg-pb-seq .sequenceNumber{fill:white;}#svg-pb-seq [id$="-sequencenumber"]{fill:#333;}#svg-pb-seq .messageText{fill:#333;stroke:none;}#svg-pb-seq .labelBox{stroke:#9370DB;fill:#ECECFF;}#svg-pb-seq .note{stroke:#aaaa33;fill:#fff5ad;}#svg-pb-seq .noteText,#svg-pb-seq .noteText>tspan{fill:black;stroke:none;}</style></svg>
